server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mesmo papel do proxy do Vite em dev (ver vite.config.ts): a chamada do
    # frontend fica same-origin, sem depender de CORS_ALLOWED no backend.
    # "app" é o nome do serviço do backend no docker-compose.
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
